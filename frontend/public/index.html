<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나만의 AI 데이터 비서</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l7 7-7 7-7-7z' fill='%232f5d50'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // 깜빡임 방지: 저장된 테마를 가장 먼저 적용
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <h1>나만의 AI 데이터 비서</h1>
        <p class="sub" id="dataName">내 데이터를 아는 AI</p>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="chat" role="tab">채팅</button>
      <button class="tab" data-tab="data" role="tab">데이터 관리</button>
    </nav>
    <div class="top-actions">
      <span class="status" id="serverStatus" title="백엔드 서버 상태"><i></i><span>연결 확인 중</span></span>
      <button class="icon-btn" id="themeToggle" aria-label="다크 모드 전환" title="다크 모드 전환">◐</button>
    </div>
  </header>

  <div class="banner hidden" id="wakeBanner">
    <span class="spinner"></span>
    <span>서버를 깨우는 중이에요. 무료 서버는 한동안 요청이 없으면 잠들어서, 첫 접속에 <b>최대 1분</b> 정도 걸릴 수 있어요.</span>
  </div>

  <!-- ===================== 채팅 탭 ===================== -->
  <main class="view" id="view-chat">
    <aside class="sidebar">
      <button class="btn primary block" id="newChatBtn">+ 새 대화</button>
      <h3 class="side-title">이전 대화</h3>
      <ul class="conv-list" id="convList"><li class="muted small">불러오는 중…</li></ul>
    </aside>

    <section class="chat">
      <div class="chat-head">
        <h2 id="chatTitle">새 대화</h2>
        <label class="toggle small" title="GPT가 필요할 때 기간 조회·통계 도구를 직접 호출합니다">
          <input type="checkbox" id="useTools" checked /> 도구 호출
        </label>
      </div>
      <div class="messages" id="messages">
        <div class="empty" id="emptyState">
          <p class="empty-title">무엇이든 물어보세요</p>
          <p class="muted">저장된 데이터 요약을 바탕으로 답해 드려요.</p>
          <div class="suggestions">
            <button class="chip">이번 달 실적이 어때?</button>
            <button class="chip">가장 실적이 좋았던 때는?</button>
            <button class="chip">무슨 요일에 제일 잘 팔려?</button>
            <button class="chip">지난 2주 흐름을 분석해줘</button>
          </div>
        </div>
      </div>
      <form class="composer" id="chatForm">
        <textarea id="chatInput" rows="1" maxlength="2000" placeholder="데이터에 대해 질문해 보세요 (Enter 전송, Shift+Enter 줄바꿈)" required></textarea>
        <button class="btn primary" id="sendBtn" type="submit">전송</button>
      </form>
    </section>

    <aside class="context">
      <h3 class="side-title">AI가 참고하는 데이터 요약</h3>
      <div class="summary-card" id="summaryMini"><p class="muted small">불러오는 중…</p></div>
      <p class="muted tiny">이 요약이 시스템 프롬프트에 주입되어 AI 답변의 근거가 됩니다.</p>
    </aside>
  </main>

  <!-- ===================== 데이터 탭 ===================== -->
  <main class="view hidden" id="view-data">
    <section class="stats" id="statCards"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>추세</h2>
        <div class="legend"><span class="lg raw"></span>일별 값 <span class="lg ma"></span>7일 이동평균</div>
      </div>
      <div class="chart-wrap"><canvas id="chart" height="260"></canvas><div class="tooltip hidden" id="tooltip"></div></div>
      <div class="extra" id="extraStats"></div>
    </section>

    <section class="grid-2">
      <div class="panel">
        <h2 id="formTitle">새 데이터 추가</h2>
        <form id="dataForm" class="form">
          <input type="hidden" id="editId" />
          <label>날짜 <input type="date" id="fDate" required /></label>
          <label>값 <input type="number" id="fValue" min="0" step="1" required placeholder="예: 250000" /></label>
          <label>메모 <input type="text" id="fMemo" maxlength="200" placeholder="선택 (예: 주말 프로모션)" /></label>
          <div class="row">
            <button class="btn primary" type="submit" id="formSubmit">추가</button>
            <button class="btn ghost hidden" type="button" id="formCancel">취소</button>
          </div>
          <p class="form-msg" id="formMsg" role="status"></p>
        </form>
        <div class="export">
          <h3 class="side-title">내보내기</h3>
          <div class="row">
            <button class="btn ghost" data-export="csv">CSV 다운로드</button>
            <button class="btn ghost" data-export="json">JSON 다운로드</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>데이터 목록 <span class="muted small" id="dataCount"></span></h2>
          <input type="search" id="filter" placeholder="날짜·메모 검색" />
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>날짜</th><th class="num">값</th><th>메모</th><th></th></tr></thead>
            <tbody id="dataBody"><tr><td colspan="4" class="muted">불러오는 중…</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="toast hidden" id="toast" role="alert"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
